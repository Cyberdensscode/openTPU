name: otpu_mxu
description: 'MXU, the MX column: streams weight chunks (D bytes/cycle) and their scale lines through prefetch
  FIFOs against up to MCOLS stationary int8 rows in ACT RAM; products in the systolic array (a DSP48E1 per
  position, weights hopping column to column), the column end (otpu_mxce: each chain end times m << sh, the
  row accumulated exactly in 48 bits), PAIR''s integer add, result FIFO, E shared lanes (i2f48, x Sw, x Sa''),
  drain with ACC/ASCALE read-modify-write, RMAX.'
allowed:
- rtl/mxu/otpu_mxu.sv
- rtl/tech/xilinx7/otpu_tech_dsp.sv
synth:
  parts:
  - top: otpu_mxu
    weight: 1
    params:
      D: 128
      MCOLS: 4
      DEPTH: 1024
      LANES: 8
      IMPL: 2
      SID: 0
    sources:
    - rtl/vpu/otpu_fp.sv
    - rtl/vpu/otpu_fpipe.sv
    - rtl/top/otpu_pkg.sv
    - rtl/tech/generic/otpu_tech_ram.sv
    - rtl/mxu/otpu_mxu.sv
    - rtl/tech/xilinx7/otpu_tech_dsp.sv
target_mhz: 110
tests:
  fast:
  - tests/test_perf.py
  - tests/test_rtl.py::test_mlp_rtl[1]
  - tests/test_rtl.py::test_attention_decode_rtl[1-8-2-100]
  - tests/test_rtl.py::test_design_size_block_128_rtl
  - tests/test_rtl.py::test_fuzz_single_slice[0]
  - tests/test_rtl.py::test_fuzz_single_slice[1]
  - tests/test_rtl.py::test_scoreboard_stress_single_slice[0]
  - tests/test_rtl.py::test_scoreboard_stress_single_slice[1]
  - tests/test_rtl.py::test_scoreboard_stress_single_slice[2]
  - tests/test_rtl.py::test_attention_layer_rtl[1]
  - tests/test_rtl.py::test_mlp_rtl[2]
  board:
  - tests/test_rtl.py::test_design_size_block_128_rtl
  - tests/test_rtl.py::test_board_memory_path_stress[1-30]
  - tests/test_rtl.py::test_board_memory_path_stress[4-80]
  - tests/test_rtl.py::test_board_memory_path_fuzz[0-40]
perf: true
